<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap');
    </style>
</head>

<body>
    <div class="header">
        Photo by <a href="https://unsplash.com/@hans_isaacson?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Hans Isaacson</a> on <a href="https://unsplash.com/photos/a-close-up-of-a-brown-sand-dune-m9h_7B6RBiM?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Unsplash</a>
    </div>
    <div class="body">
        <div class="card-scene">
            <div class="card" id="card">
                <div class="card-face card-front">
                    <img class="card-image">
                    <div class="card-data">
                        <div class="card-data-name">Klak Codes</div>
                        <div class="divider"></div>
                        <div class="card-data-desc">Hello, I am a Junior Developer from the United Kingdom!</div>
                        <div class="divider"></div>
                        <a class="github-link" href="https://github.com/KlakCodes">
                            <img class="link-icon">
                            My portfolio
                        </a>
                    </div>
                </div>
                <div class="card-face card-back">
                    <div class="card-back-content">
                        <div class="card-back-name">Klak Codes</div>
                        <div class="back-tagline">Junior Developer</div>
                        <div class="divider divider-light"></div>
                        <div class="back-skills">
                            <span class="skill-tag">HTML</span>
                            <span class="skill-tag">CSS</span>
                            <span class="skill-tag">JavaScript</span>
                            <span class="skill-tag">Webpack</span>
                        </div>
                        <div class="divider divider-light"></div>
                        <div class="back-contact">
                            <span>klakcodes@example.com</span>
                            <span>github.com/KlakCodes</span>
                            <span>United Kingdom</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">Footer</div>
</body>

</html>
